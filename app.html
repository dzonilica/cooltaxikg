<!doctype html>
<html lang="sr-RS">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cool Taxi · Preuzmi aplikaciju — App Store i Google Play</title>
<meta name="description" content="Preuzmi Cool Taxi aplikaciju za iOS i Android — naruči taxi u Kragujevcu u 2 klika.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#7DC242">
<link rel="canonical" href="https://taxikragujevac.com/aplikacija">
<link rel="icon" type="image/png" href="uploads/logozatab.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Geist",system-ui,sans-serif;
  background:#eef7e2;
  color:#101510;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:32px;
  position:relative;overflow:hidden;
}
body::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(125,194,66,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(125,194,66,.12) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center,#000,transparent 70%);
}
.box{
  position:relative;z-index:1;
  max-width:480px;width:100%;
  background:#fff;border-radius:28px;
  padding:48px 36px;text-align:center;
  border:1px solid rgba(26,26,26,.08);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.15);
}
.logo{
  width:72px;height:72px;
  background:#7DC242;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;
  font-family:"Bricolage Grotesque";font-weight:800;font-size:38px;color:#1a1a1a;
}
h1{
  font-family:"Bricolage Grotesque";font-weight:800;
  font-size:36px;line-height:1.05;letter-spacing:-.02em;
  margin-bottom:14px;
}
h1 em{color:#5fa029;font-style:normal}
p{color:#3a3a3a;margin-bottom:32px;font-size:15px}
.spinner{
  width:42px;height:42px;margin:0 auto 24px;
  border:3px solid #eef7e2;border-top-color:#7DC242;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.choice{display:flex;gap:12px;margin-top:24px}
.choice a{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;border-radius:14px;
  background:#1a1a1a;color:#fff;
  font-size:14px;font-weight:600;
  text-decoration:none;
  transition:background .2s;
}
.choice a:hover{background:#5fa029}
.choice a.android{background:#7DC242;color:#1a1a1a}
.choice a.android:hover{background:#1a1a1a;color:#7DC242}
.foot{
  margin-top:24px;font-family:"Geist Mono",monospace;
  font-size:11px;color:#7a7a7a;
}
.detected{
  font-family:"Geist Mono",monospace;font-size:12px;
  background:#f7fbf0;color:#5fa029;
  display:inline-block;padding:6px 12px;border-radius:999px;
  margin-bottom:20px;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">ct</div>
  <div class="detected" id="detected" data-en="Detecting your device…">Detektujem uređaj…</div>
  <h1 id="title-h1"><span data-en="Downloading">Preuzimanje</span> <em>Cool Taxi</em> <span data-en="app">aplikacije</span></h1>
  <p data-en="We're sending you to the right app store for your device.">Preusmeravamo te na pravu prodavnicu aplikacija za tvoj uređaj.</p>
  <div class="spinner"></div>
  <div class="choice">
    <a href="https://apps.apple.com/" class="ios">App Store (iOS)</a>
    <a href="https://play.google.com/" class="android">Google Play (Android)</a>
  </div>
  <div class="foot">Cool Taxi · Kragujevac · 034 200 555</div>
</div>
<script>
(function(){
  // pull stored language (same key as i18n.js)
  let lang = 'sr';
  try { lang = localStorage.getItem('cooltaxi-lang') || 'sr'; } catch(e){}
  const isEn = lang === 'en';
  document.documentElement.lang = isEn ? 'en' : 'sr-RS';

  // apply text translations from data-en
  document.querySelectorAll('[data-en]').forEach(el => {
    if (isEn) el.textContent = el.getAttribute('data-en');
  });

  const ua = navigator.userAgent || navigator.vendor || window.opera || '';
  const det = document.getElementById('detected');
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /android/i.test(ua);
  const iosUrl = 'https://apps.apple.com/';
  const androidUrl = 'https://play.google.com/';
  const msgs = isEn
    ? { ios: '✓ iOS detected — App Store', and: '✓ Android detected — Google Play', desktop: '✓ Desktop — pick a platform' }
    : { ios: '✓ iOS detektovan — App Store', and: '✓ Android detektovan — Google Play', desktop: '✓ Desktop — izaberi platformu' };
  if (isIOS) {
    det.textContent = msgs.ios;
    setTimeout(() => location.href = iosUrl, 1500);
  } else if (isAndroid) {
    det.textContent = msgs.and;
    setTimeout(() => location.href = androidUrl, 1500);
  } else {
    det.textContent = msgs.desktop;
  }
})();
</script>
</body>
</html>
